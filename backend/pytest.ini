[pytest]
# Backend pytest configuration.
#
# `testpaths` keeps a bare `pytest` (run from `backend/`) inside the test tree.
testpaths = tests

# Open issue 2.4 introduced a long-running performance-budget suite under
# `backend/tests/perf/`. Its tests are marked `perf` and are excluded from the default
# run so the fast unit/integration job stays fast:
#
#   pytest backend/tests -q                  -> everything EXCEPT the perf budget (~30 s)
#   pytest backend/tests/perf -q -m perf     -> the perf budget only (1-2 min)
#
# The `-m perf` on the command line wins over this addopts filter, which is how the
# dedicated CI job and README instructions invoke it.
markers =
    perf: long-running performance-budget assertions (excluded from the default suite; run with -m perf)

addopts = -m "not perf"
